[package]
name         = "bench"
description  = "Latency + throughput harness driving clients against each transport."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

# Binary, not a library — `cargo run -p bench` from the workspace root,
# or `just bench` for the cluster-managed end-to-end run.
[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-postgres = { workspace = true }
anyhow         = { workspace = true }
clap           = { workspace = true }
