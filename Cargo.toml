# Workspace root for pg_transport.
#
# Member crates live in crates/. Shared dependency versions are hoisted
# into [workspace.dependencies] so member manifests can `workspace = true`.
# See docs/design/workspace.md ("Cargo workspace layout") for the rationale.

[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
repository   = "https://github.com/example/pg_transport"
authors      = ["pg_transport contributors"]

[workspace.dependencies]
# pgrx requires exact-version pinning; bump in lockstep across the workspace.
pgrx       = { version = "=0.18.0" }
pgrx-tests = { version = "=0.18.0" }

# Async runtime + Stream trait. Backend uses current-thread `block_on`
# per handoff; frontend uses current-thread + LocalSet. See
# docs/design/backend-handoff.md and docs/design/architecture.md.
tokio   = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false }

# Wire layer (sunng87/pgwire). Phase 4 brings up the FE/BE v3
# protocol; we pull in the server API but stay off the TLS feature
# flags (aws-lc-rs / ring) — TLS lands phase 8 via tokio-openssl.
pgwire = { version = "0.40", default-features = false, features = ["server-api"] }

# TLS in the wire layer (Q12: rust-openssl). Not yet linked into stubs.
openssl       = "0.10"
tokio-openssl = "0.6"

# Misc.
thiserror   = "2"
parking_lot = "0.12"
anyhow      = "1"
async-trait = "0.1"
bytes       = "1"
# CancellationToken for the ShutdownToken plumbing in api/. Tokio
# core has watch / Notify but neither is quite the right shape;
# tokio-util's CancellationToken is the idiomatic choice and a
# small dep (sync feature only).
tokio-util  = { version = "0.7", default-features = false }

# ---------------------------------------------------------------------------
# Profile settings
# ---------------------------------------------------------------------------
#
# panic = "unwind" workspace-wide. Q9 originally chose abort; Q24
# overrode that during phase-1 implementation because pgrx 0.18
# routes `error!()` / `ereport!(ERROR, …)` through `panic_any` and
# catches PG ERRORs as Rust panics for `PgTryBuilder` — both paths
# break under panic=abort. See roadmap.md §2.3 Q9 / Q24 for the
# full reasoning.

[profile.dev]
panic = "unwind"

[profile.release]
panic         = "unwind"
opt-level     = 3
lto           = "fat"
codegen-units = 1
