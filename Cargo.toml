# Workspace root for pg_transport.
#
# Member crates live in crates/. Shared dependency versions are hoisted
# into [workspace.dependencies] so member manifests can `workspace = true`.
# See docs/design/workspace.md ("Cargo workspace layout") for the rationale.

[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
repository   = "https://github.com/example/pg_transport"
authors      = ["pg_transport contributors"]

[workspace.dependencies]
# pgrx requires exact-version pinning; bump in lockstep across the workspace.
pgrx       = { version = "=0.18.0" }
pgrx-tests = { version = "=0.18.0" }

# Async runtime + Stream trait. Backend uses current-thread `block_on`
# per handoff; frontend uses current-thread + LocalSet. See
# docs/design/backend-handoff.md and docs/design/architecture.md.
tokio   = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false }

# Wire layer (sunng87/pgwire). Phase 4 brings up the FE/BE v3
# protocol; phase 8 enables TLS via tokio_rustls + ring (Q12
# re-litigated as Q26 — pgwire 0.40 hard-binds TLS to tokio_rustls,
# so the original rust-openssl plan would need a pgwire fork).
pgwire = { version = "0.40", default-features = false, features = ["server-api-ring"] }

# Phase-5 bench client: tokio-postgres as the libpq-compatible
# client driver. `default = ["runtime"]` is fine — bench is its
# own binary, not the cdylib, so feature unification with `core`
# doesn't matter.
tokio-postgres = "0.7"

# CLI parser for the bench harness (derive macros + auto-generated
# `--help`). Used by `bench` only; never touched by the cdylib.
clap = { version = "4", features = ["derive"] }

# TLS in the wire layer. Q12 picked rust-openssl; Q26 re-litigated
# to rustls (via tokio_rustls + ring) because pgwire 0.40 hard-binds
# its TLS plumbing to tokio_rustls. tokio_rustls itself comes in
# transitively via pgwire's `_ring` feature; we add it as a direct
# dep here so our setup_tls() code can name the types without
# reaching through pgwire's re-exports. rustls-pemfile +
# rustls-pki-types are for loading PEM cert/key files.
tokio-rustls    = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile  = "2"
rustls-pki-types = "1"

# Misc.
thiserror   = "2"
parking_lot = "0.12"
anyhow      = "1"
async-trait = "0.1"
bytes       = "1"
# Insertion-ordered map for the pool's `ready` container (FIFO
# fairness with O(1) pop-front). See
# docs/design/deferred/slot-readiness.md §5.7.
indexmap    = "2"
# RAII guard for resetting the pool's `growing` AtomicBool on the
# panic-unwind path through grow_one(). 5 KB crate, no deps.
scopeguard  = "1"
# CancellationToken for the ShutdownToken plumbing in api/. Tokio
# core has watch / Notify but neither is quite the right shape;
# tokio-util's CancellationToken is the idiomatic choice and a
# small dep (sync feature only).
tokio-util  = { version = "0.7", default-features = false }

# ---------------------------------------------------------------------------
# Profile settings
# ---------------------------------------------------------------------------
#
# panic = "unwind" workspace-wide. Q9 originally chose abort; Q24
# overrode that during phase-1 implementation because pgrx 0.18
# routes `error!()` / `ereport!(ERROR, …)` through `panic_any` and
# catches PG ERRORs as Rust panics for `PgTryBuilder` — both paths
# break under panic=abort. See roadmap.md §2.3 Q9 / Q24 for the
# full reasoning.

[profile.dev]
panic = "unwind"

[profile.release]
panic         = "unwind"
opt-level     = 3
lto           = "fat"
codegen-units = 1
